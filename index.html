<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekod Aset - SK Kampong Tengah, Temerloh</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1344b0;
    --primary-light: #e8efff;
    --accent: #f59e0b;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --bg: #f0f4ff;
    --surface: #ffffff;
    --surface2: #f8faff;
    --border: #dde5f4;
    --text: #0f172a;
    --text-muted: #64748b;
    --shadow: 0 4px 24px rgba(26,86,219,0.10);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  header {
    background: linear-gradient(135deg, #1a56db 0%, #1e3a8a 100%);
    color: white;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    box-shadow: 0 2px 16px rgba(26,86,219,0.25);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-logo {
    width: 38px; height: 38px;
    background: rgba(255,255,255,0.18);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  header h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 11px;
    opacity: 0.75;
    margin-top: 1px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 9px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    transition: all 0.18s;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }

  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }

  .btn-white {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.25);
  }

  .btn-white:hover { background: rgba(255,255,255,0.25); }

  .btn-outline {
    background: white;
    color: var(--primary);
    border: 1.5px solid var(--border);
  }

  .btn-outline:hover { border-color: var(--primary); background: var(--primary-light); }

  .btn-danger {
    background: #fef2f2;
    color: var(--danger);
    border: 1.5px solid #fecaca;
  }

  .btn-danger:hover { background: #fee2e2; }

  .btn-success {
    background: var(--success);
    color: white;
  }

  .btn-success:hover { background: #059669; transform: translateY(-1px); }

  .btn-sm {
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 7px;
  }

  /* ─── LAYOUT ─── */
  .app-layout {
    display: flex;
    min-height: calc(100vh - 64px);
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 12px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 10px 4px;
    margin-top: 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-muted);
    transition: all 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }

  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

  .nav-icon { font-size: 17px; width: 22px; text-align: center; }

  .badge {
    margin-left: auto;
    background: var(--primary);
    color: white;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    min-width: 20px;
    text-align: center;
  }

  /* ─── MAIN ─── */
  .main {
    flex: 1;
    padding: 28px 32px;
    overflow-x: hidden;
  }

  /* ─── VIEWS ─── */
  .view { display: none; }
  .view.active { display: block; }

  /* ─── DASHBOARD ─── */
  .page-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .page-sub {
    color: var(--text-muted);
    font-size: 13.5px;
    margin-bottom: 24px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    border-radius: 0 14px 0 80px;
    opacity: 0.08;
  }

  .stat-card.blue::before { background: var(--primary); }
  .stat-card.amber::before { background: var(--accent); }
  .stat-card.green::before { background: var(--success); }
  .stat-card.red::before { background: var(--danger); }

  .stat-icon {
    font-size: 26px;
    margin-bottom: 10px;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -1px;
    font-family: 'JetBrains Mono', monospace;
  }

  .stat-label {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 500;
  }

  /* ─── TABLE SECTION ─── */
  .section-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .section-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .section-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 7px 12px;
    transition: border 0.15s;
  }

  .search-box:focus-within { border-color: var(--primary); }

  .search-box input {
    background: none;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    width: 190px;
  }

  select.filter-select {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    outline: none;
  }

  select.filter-select:focus { border-color: var(--primary); }

  /* ─── TABLE ─── */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  thead th {
    background: var(--surface2);
    padding: 12px 16px;
    text-align: left;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
    cursor: pointer;
  }

  tbody tr:hover { background: var(--primary-light); }
  tbody tr:last-child { border-bottom: none; }

  td {
    padding: 13px 16px;
    vertical-align: middle;
  }

  .td-mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--primary);
    font-weight: 500;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
  }

  .status-baik { background: #d1fae5; color: #065f46; }
  .status-rosak { background: #fee2e2; color: #991b1b; }
  .status-baik-pulih { background: #fef3c7; color: #92400e; }
  .status-lupus { background: #f3f4f6; color: #374151; }

  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-baik { background: #10b981; }
  .dot-rosak { background: #ef4444; }
  .dot-baik-pulih { background: #f59e0b; }
  .dot-lupus { background: #9ca3af; }

  .action-group { display: flex; gap: 6px; }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.55);
    backdrop-filter: blur(3px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: white;
    border-radius: 18px;
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(26,86,219,0.25);
    animation: modalIn 0.22s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.93) translateY(16px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-header {
    padding: 22px 26px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }

  .modal-close {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .modal-close:hover { background: #fee2e2; border-color: #fca5a5; color: var(--danger); }

  .modal-body { padding: 22px 26px; }

  .modal-footer {
    padding: 16px 26px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* ─── FORM ─── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
  }

  label span { color: var(--danger); }

  input[type=text],
  input[type=number],
  input[type=date],
  input[type=email],
  textarea,
  select.form-select {
    width: 100%;
    padding: 10px 13px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text);
    background: var(--surface2);
    outline: none;
    transition: border 0.15s, background 0.15s;
  }

  input:focus, textarea:focus, select.form-select:focus {
    border-color: var(--primary);
    background: white;
  }

  textarea { resize: vertical; min-height: 80px; }

  /* ─── DETAIL MODAL ─── */
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .detail-item label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
    display: block;
  }

  .detail-item .val {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  /* ─── TOAST ─── */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .toast {
    background: white;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    border-left: 4px solid var(--success);
    font-size: 13.5px;
    font-weight: 600;
    animation: toastIn 0.25s ease;
    min-width: 260px;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .toast.error { border-color: var(--danger); }

  /* ─── CHART ─── */
  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 100px;
    padding-top: 10px;
  }

  .bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .bar {
    width: 100%;
    border-radius: 5px 5px 0 0;
    transition: height 0.5s cubic-bezier(.34,1.56,.64,1);
  }

  .bar-label { font-size: 10px; color: var(--text-muted); font-weight: 600; }
  .bar-val { font-size: 11px; font-weight: 700; color: var(--text); }

  /* ─── DASHBOARD BOTTOM ─── */
  .dash-bottom {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
  }

  .category-list { padding: 10px 0; }

  .cat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 22px;
    border-bottom: 1px solid var(--border);
  }

  .cat-item:last-child { border: none; }

  .cat-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .cat-name { flex: 1; font-size: 13.5px; font-weight: 500; }
  .cat-count { font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

  /* ─── EXPORT ─── */
  .export-panel {
    padding: 22px 26px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }

  .export-card {
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: all 0.18s;
  }

  .export-card:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-2px); }

  .export-card .icon { font-size: 32px; margin-bottom: 10px; }
  .export-card .title { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
  .export-card .desc { font-size: 11.5px; color: var(--text-muted); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .dash-bottom { grid-template-columns: 1fr; }
    .main { padding: 20px 16px; }
  }

  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
  }

  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .github-note {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: white;
    border-radius: var(--radius);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .github-note .icon { font-size: 28px; flex-shrink: 0; }
  .github-note h3 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .github-note p { font-size: 12px; opacity: 0.75; }
  .github-note code {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(255,255,255,0.15);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 11px;
  }
</style>
</head>
